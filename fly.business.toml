app = "whatsapp-business-mdm"
primary_region = "gru"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "wa_biz_data"
  destination = "/app/data"

[env]
  ASSISTANT_MODE = "business"
  BUSINESS_NAME = "MD Business"
  BUSINESS_OWNER_NUMBER = "244926115429"
