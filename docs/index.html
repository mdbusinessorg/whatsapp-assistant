<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MD Business — CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="login" class="login card" hidden>
  <div class="logo" style="justify-content:center;margin:0 0 18px"><b>MD</b> Business CRM</div>
  <p class="muted small">Palavra-passe do painel</p>
  <input id="tok" class="in" type="password" autofocus onkeydown="if(event.key==='Enter')saveTok()">
  <p><button class="btn" onclick="saveTok()" style="width:100%">Entrar</button></p>
</div>
<div id="app" class="shell" hidden>
  <aside class="side">
    <div class="logo"><b>MD</b> Business</div>
    <nav class="nav" id="nav"></nav>
    <div class="me"><div class="avatar">MD</div>MD Business<div class="muted small" id="me-num"></div></div>
  </aside>
  <main>
    <div class="top">
      <div class="pill"><span class="circ" id="wa-ic"></span><span id="wa-txt">WhatsApp</span></div>
      <div class="pill clock"><div id="clk"></div><div><b>Luanda</b><br><span class="muted">WAT</span></div></div>
      <div class="pill search"><span class="circ" id="s-ic"></span><input id="q" placeholder="Procurar leads…" oninput="go('leads')"></div>
      <button class="circ" title="Pendentes" onclick="go('follow')" id="bell"></button>
      <button class="circ light" title="Leads quentes" onclick="go('leads','hot')" id="mail"></button>
    </div>
    <section class="view on" id="v-home"></section>
    <section class="view" id="v-leads"></section>
    <section class="view" id="v-funnel"></section>
    <section class="view" id="v-follow"></section>
    <section class="view" id="v-obj"></section>
    <section class="view" id="v-act"></section>
    <section class="view" id="v-wa"></section>
  </main>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)closeLead()"><div class="card" id="lead"></div></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
<script src="views.js"></script>
<script src="views2.js"></script>
<script src="views3.js"></script>
</body>
</html>
